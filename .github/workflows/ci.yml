name: Automated Code Review on PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  checkstyle-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Inline Checkstyle Review Comments
        uses: dbelyaev/action-checkstyle@v0.8.2
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_xml_path: target/checkstyle-result.xml
          level: warning

      - name: Build and Test with Maven
        run: mvn clean package
